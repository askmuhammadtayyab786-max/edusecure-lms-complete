version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: edusecure-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: edusecure_lms
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-run on first init: schema, least-privilege user, seed admin
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/create_app_user.sql:/docker-entrypoint-initdb.d/2-create_app_user.sql:ro
      - ./db/seed_admin.sql:/docker-entrypoint-initdb.d/3-seed_admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_me_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edusecure-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edusecure-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - edusecure-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: edusecure-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - edusecure-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  edusecure-net:
    driver: bridge
